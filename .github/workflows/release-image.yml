# Build the all-in-one Davyn image and push it to the GitHub Container Registry
# (GHCR). The image name follows the repository owner automatically, so a fork
# publishes to its own namespace without edits:
#
#     ghcr.io/<owner>/davyn:0.5.0-alpha
#     ghcr.io/<owner>/davyn:latest-alpha
#
# Triggers:
#   * pushing a tag like v0.5.0-alpha
#   * manual run (Actions → Build & publish image → Run workflow)
#
# GHCR setup (one-time): the GITHUB_TOKEN below already has package-write rights
# via the `packages: write` permission. After the first push, the package may be
# private — make it public (or grant pull access) under
# GitHub → your profile/org → Packages → davyn → Package settings.
name: Build & publish image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/davyn

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # The alpha version tag, e.g. from a v0.5.0-alpha git tag
            type=semver,pattern={{version}}
            # A moving alpha pointer
            type=raw,value=latest-alpha
            # Always also tag the explicit current alpha
            type=raw,value=0.5.0-alpha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
