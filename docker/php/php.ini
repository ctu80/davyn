; Davyn PHP hardening overrides (loaded from conf.d)

; Never render PHP errors/stack traces into responses; log them instead.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL

; Do not advertise PHP via the X-Powered-By header.
expose_php = Off

; Reject uninitialized/forged session IDs (defense against session fixation).
; The cookie flags themselves are set per-request by the application.
session.use_strict_mode = 1
session.cookie_httponly = 1

; Import uploads. Calendar/contact exports (esp. vCards with embedded photos) can be
; large, and the web UI allows selecting several files at once, so post_max_size must
; cover the *sum* of one multi-file POST. The importer reads each file into memory and
; regex-splits it, hence the raised memory_limit.
upload_max_filesize = 25M
post_max_size = 100M
memory_limit = 256M
